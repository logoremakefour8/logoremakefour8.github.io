<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Card Generator — Demo Profiles</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #eef1f8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 15% 10%, #27365a 0, transparent 38%),
        radial-gradient(ellipse at 90% 90%, #302247 0, transparent 35%),
        #10131c;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(22px, 5vw, 40px);
      border: 1px solid #ffffff20;
      border-radius: 22px;
      background: #191d29eF;
      box-shadow: 0 24px 80px #0007;
    }

    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 5vw, 2.3rem); }
    .intro { margin: 0 0 24px; color: #b7bfd2; line-height: 1.55; }

    .notice {
      margin-bottom: 24px;
      padding: 12px 14px;
      border: 1px solid #e8b65b55;
      border-radius: 10px;
      background: #e8b65b12;
      color: #f3d89e;
      font-size: .92rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label { display: grid; gap: 7px; color: #dce2f0; font-size: .93rem; }

    select, input, textarea, button {
      font: inherit;
      border-radius: 10px;
    }

    select, input {
      width: 100%;
      padding: 11px 12px;
      color: #f4f6fb;
      border: 1px solid #ffffff28;
      background: #111521;
    }

    select:focus, input:focus, textarea:focus {
      outline: 2px solid #8daeff;
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button, .restart {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border: 0;
      background: #7699ff;
      color: #101525;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover, .restart:hover { filter: brightness(1.08); }
    button.secondary, .restart {
      border: 1px solid #ffffff30;
      background: #ffffff0b;
      color: #eef1f8;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 26px 0 10px;
    }

    .output-header h2 { margin: 0; font-size: 1.1rem; }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #ffffff20;
      background: #0c0f17;
      color: #dce5ff;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .status { min-height: 1.4em; margin: 10px 0 0; color: #b7bfd2; font-size: .9rem; }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .output-header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Credit Card Generator</h1>
    <p class="intro">Create fictional profiles for interface demos and sample data.</p>

    <div class="notice" role="note">
      Demo only: generated references are not payment cards and cannot be used to make purchases.
      This tool does not generate card numbers, security codes, or expiration dates.
    </div>

    <div class="grid">
      <label for="country">
        Country
        <select id="country">
          <option value="United States">United States</option>
          <option value="Chile">Chile</option>
        </select>
      </label>

      <label for="brand">
        Brand
        <select id="brand">
          <option>MasterCard</option>
          <option>Visa</option>
        </select>
      </label>

      <label for="bank">
        Bank
        <select id="bank"></select>
      </label>

      <label for="format">
        Export format
        <select id="format">
          <option value="JSON">JSON</option>
          <option value="XML">XML</option>
          <option value="CSV">CSV</option>
          <option value="TXT">TXT</option>
        </select>
      </label>
    </div>

    <div class="actions">
      <button id="generate" type="button">Generate demo profile</button>
      <button id="reset" class="secondary" type="button">Reset</button>
      <a class="restart" href="https://logoremakefour8.github.io/ccg?reset=Credit%20Card%20Generator">Restart / refresh</a>
    </div>

    <div class="output-header">
      <h2>Generated output</h2>
      <button id="copy" class="secondary" type="button">Copy output</button>
    </div>
    <textarea id="output" aria-label="Generated demo profile output" readonly
      placeholder="Your fictional demo profile will appear here."></textarea>
    <p id="status" class="status" aria-live="polite"></p>
  </main>

  <script>
    const banksByCountry = {
      "United States": ["1st State Bank", "Walmart+"],
      "Chile": [
        "Scotiabank",
        "Lider Bci",
        "Mercado Pago",
        "Santander",
        "Banco de Chile",
        "Tarjeta ABC (Credit Card Bank ABC Chile)"
      ]
    };

    const country = document.getElementById("country");
    const brand = document.getElementById("brand");
    const bank = document.getElementById("bank");
    const format = document.getElementById("format");
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    function populateBanks() {
      bank.replaceChildren(...banksByCountry[country.value].map(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        return option;
      }));
    }

    function makeReference() {
      const bytes = new Uint8Array(6);
      crypto.getRandomValues(bytes);
      return "DEMO-" + Array.from(bytes, byte => byte.toString(16).padStart(2, "0"))
        .join("").toUpperCase();
    }

    function escapeXml(value) {
      return String(value).replace(/[<>&'"]/g, character => ({
        "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;"
      })[character]);
    }

    function csvCell(value) {
      return '"' + String(value).replace(/"/g, '""') + '"';
    }

    function serialize(profile, selectedFormat) {
      switch (selectedFormat) {
        case "JSON":
          return JSON.stringify(profile, null, 2);
        case "XML":
          return "<demoProfile>\n" +
            Object.entries(profile).map(([key, value]) =>
              `  <${key}>${escapeXml(value)}</${key}>`
            ).join("\n") +
            "\n</demoProfile>";
        case "CSV":
          return Object.keys(profile).map(csvCell).join(",") + "\n" +
            Object.values(profile).map(csvCell).join(",");
        case "TXT":
          return Object.entries(profile).map(([key, value]) =>
            `${key}: ${value}`
          ).join("\n");
        default:
          return "";
      }
    }

    document.getElementById("generate").addEventListener("click", () => {
      const profile = {
        type: "fictional_demo_profile",
        reference: makeReference(),
        country: country.value,
        brand: brand.value,
        bank: bank.value,
        paymentCredential: false
      };
      output.value = serialize(profile, format.value);
      status.textContent = "Fictional demo profile generated.";
    });

    document.getElementById("reset").addEventListener("click", () => {
      country.value = "United States";
      brand.value = "MasterCard";
      format.value = "JSON";
      populateBanks();
      output.value = "";
      status.textContent = "Form and output reset.";
    });

    document.getElementById("copy").addEventListener("click", async () => {
      if (!output.value) {
        status.textContent = "Generate a demo profile before copying.";
        return;
      }
      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = "Output copied.";
      } catch {
        output.select();
        document.execCommand("copy");
        status.textContent = "Output copied.";
      }
    });

    country.addEventListener("change", populateBanks);
    populateBanks();

    // The restart URL's reset query starts the page with default selections and empty output.
    if (new URLSearchParams(location.search).get("reset") === "Credit Card Generator") {
      document.getElementById("reset").click();
    }
  </script>
</body>
</html>
